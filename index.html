<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMA | MBTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           RESET
        ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #010103;
            color: #fff;
            font-family: "Cairo", sans-serif;
            overflow-x: hidden;
        }

        /* =========================================================
           الخلفية الكونية الواقعية
        ========================================================= */
        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 50%, #0a0a1a 0%, #010103 100%);
        }

        /* نجوم متعددة الطبقات */
        .stars-layer {
            position: absolute;
            inset: 0;
            background-repeat: repeat;
            pointer-events: none;
        }

        .stars-layer.small {
            background-image:
                radial-gradient(1px 1px at 25px 35px, rgba(255,255,255,.8), transparent),
                radial-gradient(1px 1px at 125px 95px, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 210px 45px, rgba(255,255,255,.7), transparent),
                radial-gradient(1px 1px at 300px 120px, rgba(255,255,255,.5), transparent),
                radial-gradient(1px 1px at 380px 30px, rgba(255,255,255,.8), transparent),
                radial-gradient(1px 1px at 450px 150px, rgba(255,255,255,.6), transparent),
                radial-gradient(1px 1px at 520px 80px, rgba(255,255,255,.7), transparent),
                radial-gradient(1px 1px at 600px 20px, rgba(255,255,255,.5), transparent),
                radial-gradient(1px 1px at 700px 100px, rgba(255,255,255,.8), transparent),
                radial-gradient(1px 1px at 780px 60px, rgba(255,255,255,.6), transparent);
            background-size: 800px 200px;
            animation: twinkleSmall 8s ease-in-out infinite alternate;
            opacity: .7;
        }

        .stars-layer.medium {
            background-image:
                radial-gradient(2px 2px at 50px 100px, rgba(255,255,255,.7), transparent),
                radial-gradient(2px 2px at 200px 50px, rgba(200,220,255,.8), transparent),
                radial-gradient(2px 2px at 350px 150px, rgba(255,255,255,.6), transparent),
                radial-gradient(2px 2px at 500px 30px, rgba(255,255,255,.7), transparent),
                radial-gradient(2px 2px at 650px 120px, rgba(200,220,255,.8), transparent),
                radial-gradient(2px 2px at 750px 40px, rgba(255,255,255,.6), transparent);
            background-size: 800px 200px;
            animation: twinkleMedium 5s ease-in-out infinite alternate;
            opacity: .8;
        }

        .stars-layer.large {
            background-image:
                radial-gradient(3px 3px at 100px 30px, rgba(255,255,255,.9), transparent),
                radial-gradient(3px 3px at 300px 90px, rgba(255,255,255,.7), transparent),
                radial-gradient(3px 3px at 500px 160px, rgba(255,255,255,.8), transparent),
                radial-gradient(3px 3px at 700px 60px, rgba(255,255,255,.6), transparent);
            background-size: 800px 200px;
            animation: twinkleLarge 4s ease-in-out infinite alternate;
            opacity: .9;
        }

        @keyframes twinkleSmall {
            0%, 100% { opacity: .5; }
            50% { opacity: 1; }
        }
        @keyframes twinkleMedium {
            0%, 100% { opacity: .6; }
            50% { opacity: .9; }
        }
        @keyframes twinkleLarge {
            0%, 100% { opacity: .7; }
            50% { opacity: 1; }
        }

        /* مجرة حلزونية 1 */
        .spiral-galaxy {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            top: -100px;
            left: -150px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,.9) 0%, rgba(180,180,255,.4) 10%, rgba(100,100,200,.2) 30%, transparent 70%);
            filter: blur(3px);
            opacity: .6;
            animation: rotateGalaxy 40s linear infinite;
            will-change: transform;
        }

        .spiral-galaxy::before {
            content: '';
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.15);
            box-shadow:
                0 0 30px rgba(150,150,255,.3),
                inset 0 0 30px rgba(255,255,255,.1);
            animation: spin 20s linear infinite reverse;
        }

        .spiral-galaxy::after {
            content: '';
            position: absolute;
            inset: 25%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.2);
            box-shadow: 0 0 20px rgba(200,200,255,.2);
            animation: spin 15s linear infinite;
        }

        @keyframes rotateGalaxy {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* مجرة حلزونية 2 (أصغر) */
        .spiral-galaxy.small {
            width: 300px;
            height: 300px;
            top: auto;
            bottom: -50px;
            right: -80px;
            left: auto;
            background: radial-gradient(ellipse at center, rgba(255,255,255,.8) 0%, rgba(180,180,255,.3) 15%, rgba(100,100,200,.15) 40%, transparent 70%);
            opacity: .5;
            animation-duration: 30s;
        }

        .spiral-galaxy.small::before {
            inset: 15%;
            border-width: 1.5px;
        }
        .spiral-galaxy.small::after {
            inset: 30%;
            border-width: 1px;
        }

        /* كوكب غازي عملاق (مثل المشتري) */
        .gas-planet {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            top: 15%;
            right: 10%;
            background:
                radial-gradient(circle at 30% 30%, #f5e6d3 0%, #d4a574 25%, #a0674a 50%, #5a3320 75%, #2a1408 100%);
            box-shadow:
                inset -30px -20px 60px rgba(0,0,0,.8),
                inset 15px 10px 30px rgba(255,255,255,.1),
                0 0 60px rgba(200,150,100,.4);
            animation: floatPlanet 12s ease-in-out infinite;
            will-change: transform;
        }

        /* حلقات الكوكب الغازي */
        .gas-planet::before {
            content: '';
            position: absolute;
            width: 220px;
            height: 60px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            border: 2px solid rgba(255,220,180,.3);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,200,150,.2);
        }

        /* كوكب صخري (مثل الأرض) */
        .rocky-planet {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            bottom: 20%;
            left: 8%;
            background:
                radial-gradient(circle at 35% 30%, #a8d8ff 0%, #4a90d9 30%, #1a4a7a 60%, #0a1a2a 100%);
            box-shadow:
                inset -15px -10px 30px rgba(0,0,0,.7),
                inset 8px 5px 15px rgba(255,255,255,.2),
                0 0 40px rgba(80,160,255,.3);
            animation: floatPlanet 14s ease-in-out infinite reverse;
            will-change: transform;
        }

        /* كوكب صخري ثانٍ (أصغر) */
        .rocky-planet.small {
            width: 45px;
            height: 45px;
            bottom: 10%;
            right: 30%;
            left: auto;
            background:
                radial-gradient(circle at 30% 25%, #ffd8a8 0%, #d98a4a 40%, #7a3a1a 70%, #1a0a05 100%);
            box-shadow:
                inset -10px -5px 20px rgba(0,0,0,.6),
                inset 5px 3px 10px rgba(255,255,255,.15),
                0 0 25px rgba(255,180,100,.3);
            animation-duration: 10s;
        }

        @keyframes floatPlanet {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* سديم ضبابي */
        .nebula {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .15;
            pointer-events: none;
        }

        .nebula.one {
            background: radial-gradient(circle, #4a3a8a 0%, transparent 60%);
            top: -200px;
            right: 10%;
            animation: driftNebula 20s ease-in-out infinite;
        }

        .nebula.two {
            background: radial-gradient(circle, #1a5a8a 0%, transparent 60%);
            bottom: -200px;
            left: 10%;
            animation: driftNebula 25s ease-in-out infinite reverse;
        }

        .nebula.three {
            background: radial-gradient(circle, #8a2a5a 0%, transparent 60%);
            top: 40%;
            left: 40%;
            width: 400px;
            height: 400px;
            opacity: .1;
            animation: driftNebula 18s ease-in-out infinite;
        }

        @keyframes driftNebula {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
        }

        /* شهب */
        .shooting-star {
            position: absolute;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff);
            transform: rotate(-35deg);
            opacity: 0;
            animation: shoot 6s linear infinite;
            pointer-events: none;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            right: -2px;
            top: -2px;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #fff;
        }

        .shooting-star.s1 { top: 20%; left: 55%; }
        .shooting-star.s2 { top: 50%; left: 70%; animation-delay: 2s; }
        .shooting-star.s3 { top: 65%; left: 25%; animation-delay: 4s; }

        @keyframes shoot {
            0% { transform: translate(0,0) rotate(-35deg); opacity: 0; }
            3% { opacity: 1; }
            15% { transform: translate(-400px, 250px) rotate(-35deg); opacity: 0; }
            100% { opacity: 0; }
        }

        /* غبار كوني متطاير */
        .cosmic-dust {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: floatDust 12s ease-in-out infinite;
        }

        .dust1 { width: 3px; height: 3px; background: rgba(255,255,255,.5); top: 30%; left: 15%; animation-delay: 0s; }
        .dust2 { width: 2px; height: 2px; background: rgba(200,200,255,.4); top: 55%; left: 45%; animation-delay: 3s; }
        .dust3 { width: 4px; height: 4px; background: rgba(255,220,180,.3); top: 75%; left: 60%; animation-delay: 6s; }
        .dust4 { width: 2px; height: 2px; background: rgba(255,255,255,.4); top: 45%; left: 80%; animation-delay: 9s; }
        .dust5 { width: 3px; height: 3px; background: rgba(180,180,255,.3); top: 65%; left: 20%; animation-delay: 2s; }

        @keyframes floatDust {
            0%, 100% { transform: translate(0,0); opacity: .3; }
            50% { transform: translate(20px, -30px); opacity: .7; }
        }

        /* =========================================================
           التطبيق
        ========================================================= */
        .app {
            position: relative;
            z-index: 5;
            min-height: 100vh;
        }

        /* باقي التنسيقات (نفس الكود السابق مع تحسينات) */
        /* ... (سنضع هنا نفس تنسيقات header, hero, quiz, result, footer مع تحسينات طفيفة) ... */

    </style>
</head>
<body>

    <!-- الخلفية الكونية الواقعية -->
    <div class="background">
        <!-- نجوم -->
        <div class="stars-layer small"></div>
        <div class="stars-layer medium"></div>
        <div class="stars-layer large"></div>

        <!-- سديم -->
        <div class="nebula one"></div>
        <div class="nebula two"></div>
        <div class="nebula three"></div>

        <!-- مجرات حلزونية -->
        <div class="spiral-galaxy"></div>
        <div class="spiral-galaxy small"></div>

        <!-- كواكب -->
        <div class="gas-planet"></div>
        <div class="rocky-planet"></div>
        <div class="rocky-planet small"></div>

        <!-- شهب -->
        <div class="shooting-star s1"></div>
        <div class="shooting-star s2"></div>
        <div class="shooting-star s3"></div>

        <!-- غبار كوني -->
        <div class="cosmic-dust dust1"></div>
        <div class="cosmic-dust dust2"></div>
        <div class="cosmic-dust dust3"></div>
        <div class="cosmic-dust dust4"></div>
        <div class="cosmic-dust dust5"></div>
    </div>

    <!-- التطبيق الكامل -->
    <div class="app">
        <!-- HEADER -->
        <header>
            <div class="logo">DOMA</div>
            <div class="header-tag">MBTI PERSONALITY</div>
        </header>

        <!-- HERO -->
        <section class="hero" id="hero">
            <div class="hero-content">
                <div class="small-title">PERSONALITY DISCOVERY</div>
                <h1>DOMA</h1>
                <p class="hero-description">
                    رحلة قصيرة إلى داخل شخصيتك.
                    أجب عن <strong>20 سؤالًا</strong> واكتشف نمط شخصيتك
                    وفق أبعاد MBTI الأربعة.
                </p>
                <button class="start-btn" onclick="startTest()">
                    ابدأ اختبار الشخصية ✦
                </button>
            </div>
        </section>

        <!-- QUIZ -->
        <section class="quiz-section" id="quizSection">
            <div class="card">
                <!-- شريط التقدم -->
                <div class="progress-wrapper" id="progressWrapper">
                    <div class="progress-info">
                        <span id="progressText">السؤال 1 من 20</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <div id="quiz" aria-live="polite"></div>
                <div class="result" id="result" aria-live="polite"></div>
            </div>
        </section>

        <footer>DOMA © 2026 • Personality Discovery</footer>
    </div>

    <script>
        /* نفس JavaScript السابق (الأسئلة، الشخصيات، الوظائف) */
        /* ... */
    </script>
</body>
</html>
