<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOMA | MBTI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#050608;
    color:#fff;
    font-family:"Cairo",sans-serif;
    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(77,101,180,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(130,75,170,.12),
            transparent 30%
        ),
        #050608;
}

/* Grid */

.grid{
    position:absolute;
    inset:-50%;
    opacity:.16;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);

    background-size:70px 70px;

    transform:perspective(600px) rotateX(60deg);

    animation:gridMove 25s linear infinite;
}

@keyframes gridMove{
    from{
        transform:perspective(600px) rotateX(60deg) translateY(0);
    }

    to{
        transform:perspective(600px) rotateX(60deg) translateY(70px);
    }
}

/* Glow */

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.12;
}

.glow.one{
    background:#536dfe;
    top:-200px;
    right:-100px;
    animation:floatGlow 12s ease-in-out infinite;
}

.glow.two{
    background:#9c4dff;
    bottom:-250px;
    left:-150px;
    animation:floatGlow 15s ease-in-out infinite reverse;
}

@keyframes floatGlow{
    0%,100%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(-30px,30px) scale(1.15);
    }
}

/* Stars */

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.5;
    animation:starPulse 4s infinite ease-in-out;
}

.star:nth-child(1){top:12%;left:10%;animation-delay:0s}
.star:nth-child(2){top:25%;left:25%;animation-delay:1s}
.star:nth-child(3){top:8%;left:42%;animation-delay:2s}
.star:nth-child(4){top:40%;left:70%;animation-delay:.5s}
.star:nth-child(5){top:65%;left:85%;animation-delay:1.5s}
.star:nth-child(6){top:80%;left:30%;animation-delay:2.5s}
.star:nth-child(7){top:72%;left:60%;animation-delay:3s}
.star:nth-child(8){top:50%;left:15%;animation-delay:1.8s}
.star:nth-child(9){top:18%;left:90%;animation-delay:2.2s}
.star:nth-child(10){top:90%;left:75%;animation-delay:.8s}
.star:nth-child(11){top:35%;left:50%;animation-delay:1.2s}
.star:nth-child(12){top:58%;left:40%;animation-delay:2.8s}

@keyframes starPulse{
    0%,100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.6);
        box-shadow:0 0 10px #fff;
    }
}

/* =========================================================
   APP
========================================================= */

.app{
    position:relative;
    z-index:5;
    min-height:100vh;
}

/* =========================================================
   HEADER
========================================================= */

header{
    width:100%;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    border-bottom:1px solid rgba(255,255,255,.07);

    background:rgba(5,6,8,.55);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:7px;

    background:linear-gradient(
        90deg,
        #fff,
        #aebdff,
        #d6a5ff,
        #fff
    );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:logoMove 6s ease infinite;
}

@keyframes logoMove{
    0%,100%{background-position:0%}
    50%{background-position:100%}
}

.header-tag{
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);

    padding:8px 15px;

    border-radius:50px;

    color:#9298a9;

    font-size:11px;
    letter-spacing:1.5px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:calc(100vh - 80px);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:60px 20px;
}

.hero-content{
    width:min(850px,100%);

    animation:heroIn 1s ease;
}

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.small-title{
    color:#8995c4;

    font-size:12px;

    letter-spacing:4px;

    margin-bottom:25px;

    text-transform:uppercase;
}

.hero h1{
    font-size:clamp(75px,15vw,155px);

    line-height:.9;

    letter-spacing:clamp(8px,3vw,25px);

    font-weight:900;

    background:
        linear-gradient(
            120deg,
            #ffffff 10%,
            #9faeff 35%,
            #c989ff 60%,
            #ffffff 90%
        );

    background-size:250%;

    -webkit-background-clip:text;
    color:transparent;

    animation:titleFlow 7s ease infinite;

    filter:
        drop-shadow(0 0 35px rgba(110,130,255,.25));
}

@keyframes titleFlow{
    0%,100%{
        background-position:0%;
    }

    50%{
        background-position:100%;
    }
}

.hero-description{
    max-width:650px;

    margin:30px auto 0;

    color:#8f95a6;

    font-size:16px;

    line-height:2.2;

    font-weight:300;
}

.hero-description strong{
    color:#dfe3f1;
    font-weight:600;
}

/* Button */

.start-btn{
    position:relative;

    margin-top:42px;

    padding:17px 38px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:14px;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(96,112,255,.8),
            rgba(139,73,220,.8)
        );

    font-family:inherit;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 15px 45px rgba(80,90,255,.18),
        inset 0 1px rgba(255,255,255,.25);

    transition:.35s;
}

.start-btn::before{
    content:"";

    position:absolute;

    top:0;
    right:-100%;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transition:.6s;
}

.start-btn:hover{
    transform:translateY(-4px);

    box-shadow:
        0 20px 60px rgba(90,100,255,.3),
        inset 0 1px rgba(255,255,255,.3);
}

.start-btn:hover::before{
    right:100%;
}

/* =========================================================
   QUIZ
========================================================= */

.quiz-section{
    width:min(850px,92%);

    margin:60px auto 100px;

    display:none;

    animation:sectionIn .6s ease;
}

@keyframes sectionIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card{
    position:relative;

    padding:38px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(20,23,32,.82),
            rgba(8,10,15,.88)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.05);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    overflow:hidden;
}

.card::after{
    content:"";

    position:absolute;

    top:0;
    left:15%;
    right:15%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(160,170,255,.5),
            transparent
        );
}

/* Progress */

.progress-info{
    display:flex;
    justify-content:space-between;

    margin-bottom:12px;

    color:#747b91;

    font-size:11px;
}

.progress{
    width:100%;
    height:5px;

    background:#181b24;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:35px;
}

.progress-bar{
    width:0;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #647bff,
            #ad68ff
        );

    box-shadow:0 0 15px rgba(110,100,255,.5);

    transition:width .5s ease;
}

/* Question */

.question{
    font-size:25px;

    line-height:1.8;

    font-weight:700;

    color:#edf0f8;

    margin-bottom:28px;

    animation:questionIn .4s ease;
}

@keyframes questionIn{
    from{
        opacity:0;
        transform:translateX(25px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

/* Answers */

.answers{
    display:grid;
    gap:13px;
}

.answer{
    position:relative;

    width:100%;

    padding:19px 22px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.025);

    color:#dfe2ec;

    font-family:inherit;

    font-size:14px;

    text-align:right;

    cursor:pointer;

    transition:.3s;

    overflow:hidden;
}

.answer::before{
    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:3px;

    background:
        linear-gradient(
            180deg,
            #7085ff,
            #b46cff
        );

    opacity:0;

    transition:.3s;
}

.answer:hover{
    transform:translateX(-5px);

    border-color:rgba(120,135,255,.35);

    background:rgba(100,110,255,.08);
}

.answer:hover::before{
    opacity:1;
}

.answer.selected{
    border-color:rgba(130,120,255,.55);

    background:
        linear-gradient(
            90deg,
            rgba(90,100,255,.13),
            rgba(150,80,220,.09)
        );

    box-shadow:
        0 8px 30px rgba(80,80,220,.12);
}

.answer.selected::before{
    opacity:1;
}

/* Next */

.next-btn{
    width:100%;

    margin-top:22px;

    padding:16px;

    border:none;

    border-radius:14px;

    background:#f1f3f8;

    color:#090a0f;

    font-family:inherit;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.3s;
}

.next-btn:disabled{
    opacity:.22;
    cursor:not-allowed;
}

.next-btn:not(:disabled):hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 30px rgba(255,255,255,.12);
}

/* =========================================================
   RESULT
========================================================= */

.result{
    display:none;

    text-align:center;

    animation:resultIn .8s ease;
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:scale(.96) translateY(20px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.result-icon{
    width:95px;
    height:95px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:45px;

    background:
        radial-gradient(
            circle,
            rgba(130,120,255,.22),
            rgba(130,80,220,.04)
        );

    border:1px solid rgba(160,150,255,.25);

    box-shadow:
        0 0 60px rgba(110,90,255,.15);

    animation:iconFloat 4s ease-in-out infinite;
}

@keyframes iconFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.result-type{
    margin-top:25px;

    font-size:60px;

    letter-spacing:12px;

    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #9dacff,
            #ca8cff,
            #fff
        );

    background-size:250%;

    -webkit-background-clip:text;

    color:transparent;

    animation:titleFlow 6s infinite;
}

.result-title{
    margin-top:5px;

    font-size:23px;

    font-weight:700;

    color:#d7dbee;
}

.result-desc{
    max-width:600px;

    margin:20px auto;

    color:#858c9f;

    line-height:2;

    font-size:14px;
}

/* Stats */

.stats{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:12px;

    margin-top:30px;
}

.stat{
    padding:20px 10px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.025);

    transition:.3s;
}

.stat:hover{
    transform:translateY(-4px);

    border-color:rgba(140,130,255,.3);

    background:rgba(120,100,255,.06);
}

.stat-code{
    font-size:22px;

    font-weight:900;

    color:#e8eaf3;
}

.stat-name{
    color:#737a90;

    font-size:10px;

    margin-top:5px;
}

.stat-percent{
    margin-top:8px;

    color:#a4adcf;

    font-size:11px;
}

/* Restart */

.restart{
    margin-top:30px;

    padding:13px 28px;

    border-radius:50px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.04);

    color:#b8bfd2;

    font-family:inherit;

    cursor:pointer;

    transition:.3s;
}

.restart:hover{
    background:rgba(120,100,255,.12);

    color:white;

    transform:translateY(-2px);
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    position:relative;
    z-index:5;

    padding:30px;

    text-align:center;

    color:#454b5b;

    font-size:11px;

    border-top:1px solid rgba(255,255,255,.05);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        height:70px;
        padding:0 5%;
    }

    .logo{
        font-size:20px;
        letter-spacing:5px;
    }

    .header-tag{
        font-size:9px;
        padding:7px 10px;
    }

    .hero{
        min-height:calc(100vh - 70px);
    }

    .hero h1{
        font-size:75px;
        letter-spacing:10px;
    }

    .hero-description{
        font-size:13px;
        line-height:2;
    }

    .start-btn{
        padding:15px 25px;
        font-size:13px;
    }

    .quiz-section{
        width:94%;
        margin-top:30px;
    }

    .card{
        padding:22px 17px;
        border-radius:22px;
    }

    .question{
        font-size:19px;
        line-height:1.8;
    }

    .answer{
        padding:16px;
        font-size:13px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .result-type{
        font-size:43px;
        letter-spacing:7px;
    }

    .result-title{
        font-size:19px;
    }
}

@media(max-width:380px){

    .hero h1{
        font-size:60px;
        letter-spacing:7px;
    }

    .result-type{
        font-size:36px;
    }
}

/* Accessibility */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}

</style>
</head>

a:[

["ترك الخيارات مفتوحة","P"]
]
}

];


/* =========================================================
   PERSONALITIES

const personalities={

/* =========================================================
   STATE
========================================================= */

let current=0;
let answers=[];


/* =========================================================
   ELEMENTS
========================================================= */

const hero=document.getElementById("hero");
const quizSection=document.getElementById("quizSection");
const quiz=document.getElementById("quiz");
const result=document.getElementById("result");


/* =========================================================
   START
========================================================= */

function startTest(){

    hero.style.display="none";

    quizSection.style.display="block";

    current=0;
    answers=[];

    showQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion(){

    const question=questions[current];

    const percent=(current/questions.length)*100;

    quiz.innerHTML=`

        <div class="progress-info">

            <span>
                السؤال ${current+1}
                من
                ${questions.length}
            </span>

            <span>
                ${Math.round(percent)}%
            </span>

        </div>

        <div class="progress">
            <div
                class="progress-bar"
                style="width:${percent}%"
            ></div>
        </div>

        <div class="question">
            ${question.q}
        </div>

        <div class="answers">

            ${question.a.map((answer,index)=>`

                <button
                    class="answer ${
                        answers[current]===answer[1]
                        ?"selected"
                        :""
                    }"
                    onclick="selectAnswer(${index})"
                >
                    ${answer[0]}
                </button>

            `).join("")}

        </div>

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            ${answers[current]?"":"disabled"}
        >

            ${
                current===questions.length-1
                ?"اكتشف نتيجتك ✦"
                :"السؤال التالي ←"
            }

        </button>

    `;

}


/* =========================================================
   SELECT
========================================================= */

function selectAnswer(index){

    answers[current]=questions[current].a[index][1];

    document
        .querySelectorAll(".answer")
        .forEach((button,i)=>{

            button.classList.toggle(
                "selected",
                i===index
            );

        });

    document.getElementById("nextBtn").disabled=false;
}


/* =========================================================
   NEXT
========================================================= */

function nextQuestion(){

    if(!answers[current]) return;

    current++;

    if(current>=questions.length){

        showResult();

    }else{

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   CALCULATE MBTI
========================================================= */

function calculateMBTI(){

    const traits={
        E:0,
        I:0,
        S:0,
        N:0,
        T:0,
        F:0,
        J:0,
        P:0
    };

    answers.forEach(answer=>{
        if(traits[answer]!==undefined){
            traits[answer]++;
        }
    });

    const type=

        (traits.E>=traits.I?"E":"I")+
        (traits.S>=traits.N?"S":"N")+
        (traits.T>=traits.F?"T":"F")+
        (traits.J>=traits.P?"J":"P");

    return {
        type,
        traits
    };

}


/* =========================================================
   RESULT
========================================================= */

function showResult(){

    quiz.style.display="none";

    result.style.display="block";

    const data=calculateMBTI();

    const type=data.type;

    const traits=data.traits;

    const personality=personalities[type];


    const dimensions=[

        {
            a:"E",
            b:"I",
            nameA:"اجتماعي",
            nameB:"انطوائي"
        },

        {
            a:"S",
            b:"N",
            nameA:"حسي",
            nameB:"حدسي"
        },

        {
            a:"T",
            b:"F",
            nameA:"منطقي",
            nameB:"عاطفي"
        },

        {
            a:"J",
            b:"P",
            nameA:"منظم",
            nameB:"مرن"
        }

    ];


    let stats="";


    dimensions.forEach(d=>{

        const total=traits[d.a]+traits[d.b];

        const percentA=
            total
            ?Math.round((traits[d.a]/total)*100)
            :50;

        const percentB=100-percentA;

        const winner=
            traits[d.a]>=traits[d.b]
            ?d.a
            :d.b;

        const winnerName=
            winner===d.a
            ?d.nameA
            :d.nameB;


        stats+=`

            <div class="stat">

                <div class="stat-code">
                    ${winner}
                </div>

                <div class="stat-name">
                    ${winnerName}
                </div>

                <div class="stat-percent">
                    ${percentA}% / ${percentB}%
                </div>

            </div>

        `;

    });


    result.innerHTML=`

        <div class="result-icon">
            ${personality.icon}
        </div>

        <div class="result-type">
            ${type}
        </div>

        <div class="result-title">
            ${personality.title}
        </div>

        <div class="result-desc">
            ${personality.desc}
        </div>

        <div class="stats">
            ${stats}
        </div>

        <button
            class="restart"
            onclick="restartTest()"
        >
            ↻ إعادة الاختبار
        </button>

    `;

}


/* =========================================================
   RESTART
========================================================= */

function restartTest(){

    current=0;

    answers=[];

    result.style.display="none";

    quiz.style.display="block";

    showQuestion();

}

</script>
